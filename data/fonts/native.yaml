# System font pack — no Google Fonts, no external requests
hugoblox:
  meta:
    format: "hugoblox-font@1"
    name: "Native"
    vendor: "custom"
    version: "1.0.0"
    license: "MIT"
    style: "serif"
    description: "System serif fonts, no external requests"

  families:
    heading: "system-serif"
    body: "system-serif"
    code: "system-mono"

  weights:
    heading: [400, 600, 700]
    body: [400, 600]
    code: [400]

  leading:
    heading: 1.2
    body: 1.7
    code: 1.5

  tracking:
    heading: "0"
    body: "0"

  variable:
    heading: false
    body: false
    code: false

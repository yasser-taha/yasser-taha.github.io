bio: |
    Seven years of R&D, four production deployments — ground detection and depth estimation algorithms in autonomous vehicles, a pharmaceutical recommender system, and small RNA biomarkers for lung cancer diagnostics — and now building viral infection diagnostics at the Robert Koch Institute. The common thread: clean ground truth is rarely available in biology, and building methods that are robust to that constraint is where my research keeps returning. That work is published across computational biology and computer vision, including a CVPR 2026 Highlight (top 3.5%).
